<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-64.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#F1ECE3" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- "default": iOS draws a solid status bar and the app starts below it, so it reaches the real bottom edge. With
         "black-translucent" iOS 26 left a 59 pt band at the bottom it never draws (WebKit bug 301108; Jake's phone, Oct 2). -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Tabor" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- Launch screens (the Tabor House mark on the ground), one per iPhone screen size, portrait. -->
    <link rel="apple-touch-startup-image" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/icons/launch-1320x2868.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/icons/launch-1290x2796.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/icons/launch-1284x2778.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/icons/launch-1206x2622.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/icons/launch-1179x2556.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/icons/launch-1170x2532.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Architects+Daughter&family=Caveat:wght@400;500;600;700&family=Homemade+Apple&family=Marck+Script&family=Patrick+Hand&display=swap" rel="stylesheet" />
    <!-- The loading mark (canvas 39a, Jake Oct 5): on the phone only, from the first paint until the day has loaded
         (src/phone/splash.ts ends it). It starts as the finished mark, where the launch screen left it, then fades and
         draws again — the ring round, the T rising, the rule out, HOUSE settling — until the day is there. -->
    <style>
      #th-splash{display:none}
      html.th-splash-on #th-splash{display:flex;position:fixed;inset:0;z-index:2147483000;align-items:center;justify-content:center;background:#F1ECE3;transition:opacity .35s ease}
      #th-splash svg{width:50vw;height:50vw;overflow:visible}
      #th-splash .ring{stroke-dasharray:1923;transform:rotate(-90deg);transform-box:view-box;transform-origin:512px 512px;animation:th-ring 3.4s cubic-bezier(.6,0,.3,1) infinite}
      #th-splash .t{animation:th-t 3.4s ease-out infinite}
      #th-splash .rule{transform-box:view-box;transform-origin:512px 622px;animation:th-rule 3.4s ease-out infinite}
      #th-splash .house{animation:th-house 3.4s ease-out infinite}
      #th-splash.done{opacity:0}
      #th-splash.done *{animation:none!important}
      @keyframes th-ring{0%,10%{stroke-dashoffset:0;opacity:1}19.9%{stroke-dashoffset:0;opacity:0}20%{stroke-dashoffset:1923;opacity:1}55%,100%{stroke-dashoffset:0;opacity:1}}
      @keyframes th-t{0%,10%{opacity:1;transform:none}20%,36%{opacity:0;transform:translateY(26px)}58%,100%{opacity:1;transform:none}}
      @keyframes th-rule{0%,10%{opacity:1;transform:scaleX(1)}19.9%{opacity:0;transform:scaleX(1)}20%,55%{opacity:1;transform:scaleX(0)}66%,100%{opacity:1;transform:scaleX(1)}}
      @keyframes th-house{0%,10%{opacity:1;transform:none}20%,60%{opacity:0;transform:translateY(12px)}78%,100%{opacity:1;transform:none}}
      @media (prefers-reduced-motion: reduce){#th-splash *{animation:none!important}}
    </style>
    <script>
      // Only a phone opening the app (the home-screen app starts on /phone); never the wall or the test fixtures.
      if (location.pathname === '/phone') {
        document.documentElement.classList.add('th-splash-on')
        // Never in the way for long, whatever happens: gone after 8 s.
        setTimeout(function () { window.__thSplashDone && window.__thSplashDone() }, 8000)
      }
    </script>
    <title>Tabor House</title>
  </head>
  <body>
    <div id="th-splash" aria-hidden="true">
      <svg viewBox="0 0 1024 1024">
        <circle class="ring" cx="512" cy="512" r="306" fill="none" stroke="#A88450" stroke-width="14" />
        <image class="t" href="/icons/mark-t.png" x="0" y="0" width="1024" height="1024" />
        <line class="rule" x1="452" y1="622" x2="572" y2="622" stroke="#A88450" stroke-width="5" />
        <image class="house" href="/icons/mark-house.png" x="0" y="0" width="1024" height="1024" />
      </svg>
    </div>
    <script>
      window.__thSplashDone = function () {
        var el = document.getElementById('th-splash')
        if (!el || el.classList.contains('done')) return
        el.classList.add('done')
        setTimeout(function () { el.remove(); document.documentElement.classList.remove('th-splash-on') }, 400)
      }
    </script>
    <div id="root"></div>
    <script src="/blank-recovery.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
