name: Design system quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run style:report
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: design-system-quality-report
          path: reports/style-audit.report.json
          if-no-files-found: error
